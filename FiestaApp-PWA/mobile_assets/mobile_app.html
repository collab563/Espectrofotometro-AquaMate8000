<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FiestaApp">
  <meta name="description" content="Encuentra proveedores para tus fiestas, revisa sus productos y arma tu pedido por WhatsApp.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/mobile-assets/icon-192.png">
  <link rel="icon" href="/mobile-assets/icon-192.png" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/mobile-assets/mobile_app.css">
  <title>FiestaApp</title>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script src="/mobile-assets/mobile_core.js" defer></script>
  <script src="/mobile-assets/mobile_customer.js" defer></script>
  <script src="/mobile-assets/mobile_admin.js" defer></script>
  <script src="/mobile-assets/mobile_boot.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app" aria-label="FiestaApp, inicio">
      <img src="/mobile-assets/icon-192.png" alt="" width="42" height="42">
      <span><strong>FiestaApp</strong><small>Ideas para celebrar</small></span>
    </a>
    <div class="top-actions">
      <a class="owner-link" href="/" title="Portal de propietarios">Propietarios</a>
      <button id="theme-button" class="icon-button" type="button" aria-label="Cambiar tema" title="Cambiar tema">☾</button>
      <button id="install-button" class="install-button" type="button" hidden>Instalar</button>
    </div>
  </header>
  <main id="app" class="app-root" tabindex="-1"></main>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="/app" data-nav="explore"><span>⌖</span>Explorar</a>
    <button type="button" data-nav-action="orders"><span>◉</span>Pedidos</button>
    <button type="button" data-nav-action="cart"><span>🛒</span>Carrito <b id="nav-cart-count">0</b></button>
    <a href="/admin" data-nav="admin"><span>⚙</span>Admin</a>
  </nav>
  <noscript>Activa JavaScript para usar FiestaApp.</noscript>
</body>
</html>
